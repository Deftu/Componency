[versions]
kotlin = "2.0.10"
dgt = "2.34.0"
android = "8.9.2"

kolor = "0.2.0"
stateful = "0.5.0"
textile = "0.16.0"

kotlinx-coroutines-core = "1.8.1"
kotlinx-atomicfu = "0.26.0"
kotlinxDatetime = "0.6.2"

skiko = "0.8.9"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }

kolor = { group = "dev.deftu", name = "kolor", version.ref = "kolor" }
stateful = { group = "dev.deftu", name = "stateful", version.ref = "stateful" }
textile = { group = "dev.deftu", name = "textile", version.ref = "textile" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
skiko-core = { group = "org.jetbrains.skiko", name = "skiko", version.ref = "skiko" }
skiko-awt = { group = "org.jetbrains.skiko", name = "skiko-awt-runtime", version.ref = "skiko" }
skiko-js = { group = "org.jetbrains.skiko", name = "skiko-js-wasm-runtime", version.ref = "skiko" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-js = { id = "org.jetbrains.kotlin.js", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

dgt-tools = { id = "dev.deftu.gradle.tools", version.ref = "dgt" }
dgt-resources = { id = "dev.deftu.gradle.tools.resources", version.ref = "dgt" }
dgt-shadow = { id = "dev.deftu.gradle.tools.shadow", version.ref = "dgt" }

dgt-multiversion-root = { id = "dev.deftu.gradle.multiversion-root", version.ref = "dgt" }
dgt-multiversion-versioned = { id = "dev.deftu.gradle.multiversion", version.ref = "dgt" }

dgt-publishing-maven = { id = "dev.deftu.gradle.tools.publishing.maven", version.ref = "dgt" }

dgt-minecraft-loom = { id = "dev.deftu.gradle.tools.minecraft.loom", version.ref = "dgt" }
dgt-minecraft-releases = { id = "dev.deftu.gradle.tools.minecraft.releases", version.ref = "dgt" }

android-library = { id = "com.android.library", version.ref = "android" }
